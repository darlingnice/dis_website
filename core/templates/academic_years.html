{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Academic Years</h1>

  <form id="academicYearForm" class="space-y-4">
    <input type="text" id="year" placeholder="2024/2025" class="border p-2 w-full rounded" />
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Add Year</button>
  </form>

  <ul id="academicYearList" class="mt-6 space-y-2"></ul>
</div>

<script src="{% static 'js/core.js' %}"></script>
{% endblock %}
