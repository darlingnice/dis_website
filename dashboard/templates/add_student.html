{% extends 'admin_dashboard.html' %}
{% load static %}

{% block cssFile %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'css/add_student.css' %}">
{% endblock %}

{% block page %}
<div id="form_container">
  <div id="title"><br>
    <h2 id="heading">Student Information</h2><br><br>
  </div>

  <div id="form_begin">
    <div class="sections" id="left">
      <label for="sur_name">Surname:</label><br>
      <input class="inputs" type="text" name="sur_name" placeholder="Sur Name" required><br>

      <label for="first_name">First Name:</label><br>
      <input class="inputs" type="text" name="first_name" placeholder="First Name" required><br>

      <label for="middle_name">Middle Name <i>(if any)</i>:</label><br>
      <input class="inputs" type="text" name="middle_name" placeholder="Middle Name" required><br>

      <div class="divider_1">
        <div class="a">
          <label for="gender" class="label_allowance">Gender:</label><br>
          <select class="half_select" name="gender" required>
            <option value="">--Select Gender--</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select><br>
        </div>

        <div class="b">
          <label for="date_of_birth" class="label_allowance">Date of Birth:</label><br>
          <input id="date_of_birth_input" class="half_input" type="date" name="date_of_birth" required><br>
        </div>
      </div>

      <label for="section">Section of Enrollment:</label>
      <select name="section" class="select">
        <option value="">--Select Section--</option>
        <option value="creche">Creche</option>
        <option value="pre-nursery">Pre-nursery</option>
        <option value="nursery">Nursery</option>
        <option value="primary">Primary</option>
        <option value="secondary">Secondary</option>
      </select><br>

      <label for="class">Class of Enrollment:</label><br>
      <input id="checkbox_1" class="class" type="checkbox" name="creche"> 
      <label for="creche"> Creche</label>
      <input id="checkbox_2" class="class" type="checkbox" name="pre-nursery"> 
      <label for="pre-nursery">Pre-nursery</label><br><br>

      <label for="nursery" class="labels">Nursery:</label>
      <select name="nursery" class="class">
        <option value="">--Select Class--</option>
        <option value="Nursery 1">Nursery 1</option>
        <option value="Nursery 2">Nursery 2</option>
        <option value="Nursery 3">Nursery 3</option>
      </select><br><br>

      <label for="primary">Primary:</label>
      <select name="primary" class="class">
        <option value="">--Select Class--</option>
        <option value="Primary 1">Primary 1</option>
        <option value="Primary 2">Primary 2</option>
        <option value="Primary 3">Primary 3</option>
        <option value="Primary 4">Primary 4</option>
        <option value="Primary 5">Primary 5</option>
      </select><br><br>

      <label for="secondary" class="labels">Secondary:</label>
      <select name="secondary" class="class">
        <option value="">--Select Class--</option>
        <option value="JSS 1">JSS 1</option>
        <option value="JSS 2">JSS 2</option>
        <option value="JSS 3">JSS 3</option>
        <option value="SSS 1">SSS 1</option>
        <option value="SSS 2">SSS 2</option>
        <option value="SSS 3">SSS 3</option>
      </select>
    </div>

    <div class="sections" id="right">
      <div class="divider_2">
        <div class="suprabankasa">
          <div>
            <label for="nationality">Nationality:</label><br>
            <input class="half_input" type="text" name="nationality" placeholder="Nationality" required>
          </div>

          <div>
            <label for="state_of_origin">State of Origin:</label><br>
            <select name="state_of_origin" class="half_select">
              <option value="">--Select State--</option>
              <option value="Abia State">Abia State</option>
              <option value="Adamawa State">Adamawa State</option>
              <option value="Akwa Ibom State">Akwa Ibom State</option>
              <option value="Anambra State">Anambra State</option>
              <option value="Bauchi State">Bauchi State</option>
              <option value="Bayelsa State">Bayelsa State</option>
              <option value="Benue State">Benue State</option>
              <option value="Borno State">Borno State</option>
              <option value="Crossriver State">Crossriver State</option>
              <option value="Delta State">Delta State</option>
              <option value="Ebonyi State">Ebonyi State</option>
              <option value="Edo State">Edo State</option>
              <option value="Ekiti State">Ekiti State</option>
              <option value="Enugu State">Enugu State</option>
              <option value="Gombe State">Gombe State</option>
              <option value="Imo State">Imo State</option>
              <option value="Jigawa State">Jigawa State</option>
              <option value="Kaduna State">Kaduna State</option>
              <option value="Kano State">Kano State</option>
              <option value="Katsina State">Katsina State</option>
              <option value="Kebbi State">Kebbi State</option>
              <option value="Kogi State">Kogi State</option>
              <option value="Kwara State">Kwara State</option>
              <option value="Lagos State">Lagos State</option>
              <option value="Nasarawa State">Nasarawa State</option>
              <option value="Niger State">Niger State</option>
              <option value="Ogun State">Ogun State</option>
              <option value="Ondo State">Ondo State</option>
              <option value="Osun State">Osun State</option>
              <option value="Oyo State">Oyo State</option>
              <option value="Plateau State">Plateau State</option>
              <option value="Rivers State">Rivers State</option>
              <option value="Sokoto State">Sokoto State</option>
              <option value="Taraba State">Taraba State</option>
              <option value="Yobe State">Yobe State</option>
              <option value="Zamfara State">Zamfara State</option>
            </select><br>
          </div>
        </div>

        <div class="suprabankasa">
          <div>
            <label for="local_government">Local Government:</label><br>
            <input class="half_input" type="text" name="local_government" placeholder="Local Government" required><br>
          </div>

          <div>
            <label for="place_of_birth">Place of Birth:</label><br>
            <input class="half_input" type="text" name="place_of_birth" placeholder="Place of Birth" required><br>
          </div>
        </div>
      </div>

      <div class="divider_1">
        <div class="a">
          <label for="guardian">Guardian:</label><br>
          <input class="half_input" type="text" name="guardian" placeholder="Guardian" required><br>
        </div>

        <div class="b">
          <label for="home_address">Home Address:</label><br>
          <input class="half_input" type="text" name="home_address" placeholder="Home Address" required><br>
        </div>
      </div>

      <label for="previous_school">Previous School:</label><br>
      <input class="last_inputs" type="text" name="previous_school" placeholder="Previous School" required><br>

      <label for="religion">Religion <i>(optional)</i>:</label><br>
      <input class="last_inputs" type="text" name="religion" placeholder="Religion"><br><br>

      <button id="submit">SUBMIT</button>
    </div>
  </div>
</div>
{% endblock %}
